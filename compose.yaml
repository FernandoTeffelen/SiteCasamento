services:
  postgres:
    image: postgres:16-alpine
    container_name: jogo-de-fotos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: site_casamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_casamento"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
