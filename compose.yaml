services:
  postgres:
    image: postgres:16-alpine
    container_name: jogo-de-fotos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: site_casamento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_casamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: jogo-de-fotos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-local
      MINIO_ROOT_PASSWORD: minio-local-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio-local minio-local-password; do sleep 1; done;
      mc mb --ignore-existing local/sitecasamento-test;
      mc anonymous set none local/sitecasamento-test;
      "

volumes:
  postgres_data:
  minio_data:
